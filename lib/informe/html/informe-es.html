:root{--bg:#EFEDE5;--tinta:#0B1424;--tinta-2:rgba(11,20,36,.72);--suave:rgba(11,20,36,.55);--linea:rgba(11,20,36,.12);--gris:rgba(11,20,36,.16);
--empresa:#3a4f8a;--acento:#7A2828;--font:"Cobbler","Montserrat",system-ui,sans-serif;--ui:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{overscroll-behavior:none}
.escena.oculta{display:none!important}
body{background:var(--bg);color:var(--tinta);font-family:var(--ui);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.tab{font-variant-numeric:tabular-nums}
.d{font-family:var(--font);font-weight:800}
/* barra (como la web) */
.nav{position:fixed;top:0;left:0;right:0;z-index:30;height:64px;display:flex;align-items:center;gap:20px;padding:0 4vw;background:linear-gradient(var(--bg) 60%,rgba(239,237,229,0))}
.logo{height:26px;width:auto;display:block}
.nav-t{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--suave);font-weight:600}
.nav-d{margin-left:auto;display:flex;gap:10px;align-items:center}
.pill{font-size:.82rem;font-weight:700;text-decoration:none;padding:.6rem 1.05rem;border-radius:999px;background:var(--tinta);color:#fff;border:0;cursor:pointer;font-family:var(--ui)}
.pill.claro{background:transparent;color:var(--tinta);box-shadow:inset 0 0 0 1px var(--gris)}
.boceto{position:fixed;bottom:0;left:0;z-index:40;background:var(--tinta);color:#fff;font-size:.74rem;padding:7px 12px}
.boceto a{color:#c9d4f2}
/* recorrido: pantallas fijas que se relevan al bajar */
.recorrido{position:relative}
.ancla{position:absolute;left:0;width:1px;height:100vh;scroll-snap-align:start}
.escenario{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.escenario::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(11,20,36,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(11,20,36,.05) 1px,transparent 1px);background-size:60px 60px;
  -webkit-mask-image:radial-gradient(ellipse 75% 85% at 50% 50%,#000 30%,transparent 82%);mask-image:radial-gradient(ellipse 75% 85% at 50% 50%,#000 30%,transparent 82%)}
.escena{position:absolute;inset:0;display:flex;align-items:center;padding:76px 0 40px;will-change:opacity,transform,filter}
.w{position:relative;width:min(92vw,1500px);margin:0 auto}
.desliza{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);font-size:.74rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--suave);display:flex;flex-direction:column;align-items:center;gap:.5rem;pointer-events:none;transition:opacity .4s}
.desliza i{width:1px;height:34px;background:linear-gradient(var(--suave),transparent);animation:baja 1.8s ease-in-out infinite}
@keyframes baja{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.puntos{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:25;display:flex;flex-direction:column;gap:10px}
.puntos button{width:8px;height:8px;border-radius:50%;border:0;background:var(--gris);cursor:pointer;position:relative;transition:transform .3s,background .3s}
.puntos button.on{background:var(--tinta);transform:scale(1.5)}
.puntos button span{position:absolute;right:18px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:.72rem;font-weight:600;color:var(--suave);opacity:0;transition:opacity .2s;pointer-events:none}
.puntos button:hover span{opacity:1}
/* piezas comunes */
.etq{font-size:.74rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--acento);transition:color .6s}
.palabra svg{width:100%;height:auto;display:block;overflow:visible}
.palabra text{font-family:var(--font);font-weight:800;fill:var(--acento);fill-opacity:.2;transition:fill .7s}
.titulo{font-family:var(--font);font-weight:800;font-size:clamp(2rem,4.2vw,3.9rem);line-height:.95;letter-spacing:-.03em}
.bajada{font-size:clamp(.95rem,1.15vw,1.12rem);line-height:1.55;color:var(--tinta-2);font-weight:500;max-width:560px;margin-top:.8rem}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:2.2vh}
/* 1 · portada */
.numero{position:relative;z-index:3;margin-top:-4.4vw;display:flex;align-items:flex-end;gap:2vw;flex-wrap:wrap}
.cifra{font-family:var(--font);font-weight:800;font-size:max(4rem,13.5vw);letter-spacing:-.05em;line-height:.8;text-shadow:0 14px 40px rgba(11,20,36,.10)}
.norma-lado{padding-bottom:1.2vw}
.norma-lado b{display:block;font-family:var(--font);font-size:max(1.3rem,2.6vw);font-weight:800;color:var(--acento);line-height:1;transition:color .6s}
.norma-lado span{display:block;font-size:max(.66rem,.9vw);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--acento);margin-top:.6em;transition:color .6s}
.lema{position:relative;z-index:1;margin-top:1.4vw;font-size:clamp(1rem,1.5vw,1.35rem);color:var(--tinta-2);font-weight:500}
.lema b{color:var(--tinta)}
.rota{display:inline-block}
/* 2 · el total */
.total-g{display:grid;grid-template-columns:1.4fr 1fr;gap:5vw;align-items:end}
.total-n{font-family:var(--font);font-weight:800;font-size:max(3.4rem,8.4vw);letter-spacing:-.05em;line-height:.85;margin-bottom:2.2vh}
.hechos{display:grid;gap:14px;padding-bottom:1vw}
.hechos div{border-top:2px solid var(--tinta);padding-top:10px}
.hechos b{font-family:var(--font);font-size:clamp(1.8rem,3vw,2.8rem);font-weight:800;line-height:1;display:block}
.hechos span{font-size:.85rem;color:var(--tinta-2)}
.reparto{display:flex;height:40px;margin-top:4vh;gap:3px}
.mide{display:grid;grid-template-columns:1fr 1fr;gap:4vw;margin-top:4vh}
.mide ul{list-style:none;display:grid;gap:6px;margin-top:10px}
.mide li{font-size:.9rem;line-height:1.45;color:var(--tinta-2);padding-left:22px;position:relative}
.mide li:before{position:absolute;left:0;top:0;font-weight:800}
#mide li:before{content:"✓";color:#4E8A26}#noMide li:before{content:"✕";color:#7A2828}
.mide li b{color:var(--tinta)}
.reparto i{display:block;height:100%;transform-origin:left;transform:scaleX(0);transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.on .reparto i{transform:scaleX(1)}
.reparto-l{display:flex;gap:3px;margin-top:10px}
.reparto-l span{font-size:.8rem;color:var(--tinta-2);overflow:hidden;white-space:nowrap}
.reparto-l b{display:block;font-family:var(--font);font-size:1.3rem;color:var(--tinta)}
/* 3 · mapa */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-family:var(--ui);font-size:.8rem;font-weight:700;border:0;border-radius:999px;padding:.5rem .85rem;cursor:pointer;background:transparent;color:var(--tinta-2);box-shadow:inset 0 0 0 1px var(--gris);transition:background .3s,color .3s}
.chip:hover{color:var(--tinta)}
.chip.on{background:var(--c);color:#fff;box-shadow:none}
.chips select{font-family:var(--ui);font-size:.8rem;font-weight:700;border:0;border-radius:999px;padding:.5rem .85rem;background:transparent;box-shadow:inset 0 0 0 1px var(--gris);color:var(--tinta-2);cursor:pointer}
.mapa-caja{position:relative;height:calc(100svh - 300px);min-height:300px}
#mapa{width:100%;height:100%;display:block}
#mapa path.p{stroke:var(--bg);stroke-width:.6;cursor:pointer;transition:fill .6s}
#mapa path.p:hover{stroke:var(--tinta);stroke-width:1.2}
#mapa path.p.sel{stroke:var(--tinta);stroke-width:1.8}
.escala{position:absolute;left:0;bottom:0;font-size:.74rem;color:var(--suave);display:grid;gap:4px}
.escala .bins{display:flex;gap:2px}.escala .bins span{width:38px;height:8px;display:block}
.escala .lbl{display:flex;gap:2px}.escala .lbl span{width:38px}
.tip{position:fixed;pointer-events:none;background:var(--tinta);color:#fff;padding:12px 14px;font-size:.82rem;z-index:50;opacity:0;transition:opacity .12s;min-width:200px;border-radius:10px}
.tip b{display:block;font-family:var(--font);font-size:1.05rem;margin-bottom:6px}
.tip .r{display:flex;justify-content:space-between;gap:16px;color:rgba(255,255,255,.8);margin-top:2px}
/* 4 · ranking */
.alterna{display:inline-flex;box-shadow:inset 0 0 0 1px var(--gris);border-radius:999px;padding:3px}
.alterna button{font-family:var(--ui);font-weight:700;font-size:.82rem;border:0;background:none;padding:.45rem .9rem;border-radius:999px;cursor:pointer;color:var(--tinta-2)}
.alterna button.on{background:var(--tinta);color:#fff}
.rank{position:relative}
.rk{position:absolute;left:0;right:0;height:calc((100svh - 330px)/11);min-height:26px;max-height:44px;display:grid;grid-template-columns:40px 220px 1fr 100px;gap:14px;align-items:center;transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .4s;cursor:pointer}
.rk .pos{color:var(--suave);text-align:right;font-weight:600;font-size:.9rem}
.rk .nom{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rk .bt{height:46%;position:relative}
.rk .bt i{position:absolute;left:0;top:0;bottom:0;background-color:rgba(11,20,36,.3);transition:width .9s cubic-bezier(.2,.7,.2,1),background .5s;border-radius:0 4px 4px 0}
/* Barra cortada: UN solo corte diagonal, limpio, del color del fondo. La nota de abajo dice cuánto mide de verdad. */
.rk .bt .q{position:absolute;top:-4px;bottom:-4px;left:calc(88% - 5px);width:9px;background:var(--bg);transform:skewX(-22deg);display:none}
.rk .bt.cortada .q{display:block}
.nota-rk{position:absolute;left:274px;font-size:.78rem;color:var(--suave);font-weight:500}
.nota-rk b{color:var(--tinta)}
.rk .val{text-align:right;font-family:var(--font);font-weight:800;font-size:1.05rem}
.rk.yo .nom,.rk.yo .val{color:var(--cn-txt)}.rk.yo .bt i{background-color:var(--cn)}
/* 5 · lo que se movió */
.mov{display:grid;grid-template-columns:1fr 1fr;gap:0 4vw}
.mv{display:grid;grid-template-columns:200px 1fr 64px;gap:12px;align-items:center;height:calc((100svh - 320px)/8);min-height:30px;max-height:54px;border-bottom:1px solid var(--linea)}
.mv .n b{font-family:var(--font);font-weight:800;font-size:1rem;display:block;line-height:1.1}
.mv .n small{font-size:.74rem;color:var(--suave);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .bt{height:12px;position:relative}
.mv .bt i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1);border-radius:0 4px 4px 0}
.mv .val{text-align:right;font-family:var(--font);font-weight:800;font-size:1.15rem}
.mv sup{color:var(--suave);font-weight:700;font-size:.7rem}
.notas{margin-top:14px;font-size:.78rem;color:var(--tinta-2);display:flex;gap:24px;flex-wrap:wrap}
/* 6 · nuevas */
.nuevas{display:grid;grid-template-columns:1fr 1fr;gap:5vw}
.nv{--c:var(--tinta)}
.nv .etq{color:var(--c)}
.nv .grande{font-family:var(--font);font-weight:800;font-size:clamp(3.4rem,8vw,7.4rem);line-height:.85;color:var(--c);letter-spacing:-.04em;margin:12px 0 8px}
.nv p{color:var(--tinta-2);margin-bottom:18px;font-weight:500;max-width:440px}
.mini{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;font-size:.86rem;padding:4px 0;font-weight:600}
.mini .bt{height:10px;position:relative}.mini .bt i{position:absolute;left:0;top:0;bottom:0;background:var(--gris);border-radius:0 4px 4px 0;width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.mini.top .bt i{background:var(--c)}.mini .val{text-align:right;font-family:var(--font);font-weight:800}
/* 7 · adivina + candado */
.candado{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(340px,440px);gap:5vw;align-items:center}
.adiv h2{font-family:var(--font);font-weight:800;font-size:clamp(1.8rem,3.4vw,3.2rem);line-height:1;letter-spacing:-.03em}
.adiv h2 em{font-style:normal;color:var(--acento)}
.adiv select{font-family:var(--font);font-weight:800;font-size:inherit;background:none;border:0;border-bottom:3px solid var(--acento);color:var(--tinta);cursor:pointer;padding:0 .1em}
.guess{font-family:var(--font);font-weight:800;font-size:clamp(4rem,10vw,9rem);line-height:.9;letter-spacing:-.05em;margin:3vh 0 1vh;color:var(--tinta)}
input[type=range]{width:100%;accent-color:var(--acento);height:28px}
.ext{display:flex;justify-content:space-between;font-size:.72rem;color:var(--suave);font-weight:600}
.resp{margin-top:2vh;display:flex;gap:28px;align-items:center;flex-wrap:wrap;min-height:84px}
.resp .real{font-family:var(--font);font-weight:800;font-size:clamp(2.2rem,4vw,3.6rem);color:var(--acento);line-height:1}
.resp p{color:var(--tinta-2);font-weight:500;max-width:380px}
.form{background:#fff;border-radius:22px;padding:24px 26px;box-shadow:0 30px 80px -40px rgba(11,20,36,.35)}
.form h3{font-family:var(--font);font-weight:800;font-size:1.6rem;line-height:1.05;letter-spacing:-.02em}
.form>p{color:var(--tinta-2);margin:8px 0 14px;font-size:.92rem}
.form ul{list-style:none;display:grid;gap:3px;margin-bottom:12px}
.form li{padding-left:20px;position:relative;color:var(--tinta-2);font-size:.88rem}
.form li:before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;border-radius:50%;background:var(--acento)}
.form label{display:grid;gap:4px;font-size:.76rem;font-weight:700;margin-bottom:9px}
.form input[type=email],.form select{font:inherit;font-weight:500;font-size:.92rem;padding:10px 12px;border:1px solid var(--gris);background:var(--bg);border-radius:12px;width:100%;color:var(--tinta)}
.form .chk{grid-template-columns:20px 1fr;align-items:start;font-weight:500;color:var(--tinta-2)}
.form .chk input{width:16px;height:16px;margin-top:2px;accent-color:var(--tinta)}
.aviso{font-size:.74rem;color:var(--suave);margin-bottom:14px}
.form .pill{width:100%;padding:.9rem;font-size:.95rem}
.enviado{display:none;padding-top:6px}.enviado.on{display:block}
.enviado b{font-family:var(--font);font-size:1.4rem;display:block}
.enviado p{color:var(--tinta-2);margin-top:6px;font-size:.9rem}
/* desbloqueado · tu país */
.sel-pais{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--suave);font-weight:600}
.sel-pais select{font-family:var(--ui);font-weight:700;font-size:.85rem;border:0;border-radius:999px;padding:.55rem .9rem;background:#fff;box-shadow:inset 0 0 0 1px var(--gris);color:var(--tinta);cursor:pointer}
.u1{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:4vw;align-items:center}
.u1-pais{font-family:var(--font);font-weight:800;font-size:clamp(3rem,7.4vw,7.6rem);line-height:.88;letter-spacing:-.045em}
.u1-en{font-size:clamp(1rem,1.3vw,1.25rem);color:var(--tinta-2);font-weight:500;margin-top:.8rem}
.u1-stats{display:grid;grid-template-columns:1fr 1fr;margin-top:4.5vh}
.st{border-top:2px solid var(--tinta);padding:14px 18px 22px 0}
.st b{display:block;font-family:var(--font);font-weight:800;font-size:clamp(2rem,3.7vw,3.6rem);line-height:1;letter-spacing:-.03em}
.st b small{font-family:var(--ui);font-size:.36em;font-weight:600;color:var(--tinta-2);letter-spacing:0;margin-left:.3em}
.st>span{display:block;font-size:.86rem;color:var(--tinta-2);font-weight:500;margin-top:6px}
.st>span em{font-style:normal;font-weight:700}
.u1-mapa{height:calc(100svh - 190px);max-height:640px}
#mapaPais{width:100%;height:100%;display:block;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 55%,transparent 100%)}
#mapaPais path{stroke:var(--bg);stroke-width:.8;transition:fill .6s}
@media(max-width:820px){.u1{grid-template-columns:minmax(0,1fr)}.u1-mapa{height:300px}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:4vh}
.tile{border-top:2px solid var(--tinta);padding:12px 18px 0 0}
.tile b{display:block;font-family:var(--font);font-size:clamp(1.8rem,3.4vw,3.2rem);font-weight:800;line-height:1}
.tile b small{font-size:.38em;color:var(--tinta-2);font-family:var(--ui);font-weight:600}
.tile>span{font-size:.82rem;color:var(--tinta-2);font-weight:500}
.sube{color:#4E8A26}.baja{color:#7A2828}
.lista{display:grid;grid-template-columns:1fr 1fr;gap:0 4vw}
.ps{display:grid;grid-template-columns:12px minmax(0,1fr) 64px 52px 130px;gap:12px;align-items:center;height:calc((100svh - 290px)/9);min-height:40px;max-height:54px;border-bottom:1px solid var(--linea);font-size:.88rem}
.ps .dot{width:10px;height:10px;border-radius:50%}
.ps .n b{font-family:var(--font);font-weight:800;display:block;line-height:1.1;white-space:nowrap}
.ps .n small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps .n small{font-size:.72rem;color:var(--suave)}
.ps .num{text-align:right;font-weight:700}
.tira-pos{position:relative;height:16px}
.tira-pos:before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--linea)}
.tira-pos i{position:absolute;top:2px;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px var(--bg);transform:translateX(-6px);left:0;transition:left .9s cubic-bezier(.2,.7,.2,1)}
.tira-pos em{position:absolute;right:0;top:-13px;font-style:normal;font-size:.68rem;color:var(--suave);white-space:nowrap}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:5vw}
.dos h3{font-family:var(--font);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;margin-bottom:6px}
.dos .sub{color:var(--tinta-2);font-size:.86rem;margin-bottom:16px}
.leyenda{display:flex;gap:16px;font-size:.8rem;font-weight:600;margin-bottom:12px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.cmp{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center;margin-bottom:8px;font-size:.84rem}
.cmp b{font-family:var(--font)}
.cmp .b{display:grid;grid-template-columns:1fr 60px;gap:8px;align-items:center;margin:2px 0}
.cmp .b span{height:9px;display:block;border-radius:0 4px 4px 0;width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.cmp .b em{font-style:normal;text-align:right;font-size:.78rem;color:var(--tinta-2);font-weight:600}
/* cierre */
.salv{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:16px 4vw;margin-top:3vh}
.salv li{color:var(--tinta-2);font-size:.92rem;line-height:1.5;border-top:1px solid var(--linea);padding-top:12px}
.salv b{color:var(--tinta)}
.cierre-cta{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-top:5vh;padding-top:3vh;border-top:2px solid var(--tinta)}
.cierre-cta p{font-family:var(--font);font-weight:800;font-size:clamp(1.4rem,2.4vw,2.2rem)}
.fuente{font-size:.74rem;color:var(--suave);margin-top:2.4vh}

.plano .recorrido{height:auto!important}
.plano .escenario{position:relative;height:auto;overflow:visible}
.plano .escena{position:relative;inset:auto;opacity:1!important;visibility:visible!important;filter:none!important;transform:none!important;pointer-events:auto!important;padding:96px 0 48px;border-bottom:1px solid var(--linea)}
.plano .ancla,.plano .puntos{display:none}
/* celular: la portada llena la pantalla y «DESLIZA» va al pie, nunca sobre el texto */
.plano #e-portada{min-height:100svh;box-sizing:border-box;padding:96px 0 110px}
.plano .desliza{bottom:30px}
.plano .numero{margin-top:-1.2vw}
.plano .reparto-l{flex-wrap:wrap;gap:10px 22px}.plano .reparto-l span{flex:none!important;overflow:visible}
.plano .mapa-caja{height:auto;min-height:0}.plano #mapa{height:auto}
.plano .escala{position:static;margin-top:8px}
.plano .rk,.plano .mv,.plano .ps{height:38px}

.sec-ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:1.6vh 0 1.4vh}
.sec-ctl select,.sec-ctl input{font-family:var(--ui);font-size:.88rem;font-weight:600;color:var(--tinta);background:#fff;border:1px solid var(--gris);border-radius:999px;padding:.55rem 1rem}
.sec-ctl input{min-width:220px;font-weight:500}
.sec-g{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:3vw;align-items:start}
.sec-lista{max-height:calc(100svh - 360px);overflow-y:auto;overscroll-behavior:contain;padding-right:6px}
.sf{display:grid;grid-template-columns:30px minmax(0,1fr) 120px 56px;gap:10px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--linea);font-size:.86rem;cursor:pointer;border-radius:8px}
.sf:hover{background:rgba(11,20,36,.04)} .sf.on{background:var(--tinta);color:#fff} .sf.on .cod,.sf.on .pc{color:rgba(255,255,255,.8)}
.sf .cod{font-size:.72rem;font-weight:700;color:var(--suave)} .sf .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.sf .bt{height:8px;background:rgba(11,20,36,.06);border-radius:4px;overflow:hidden} .sf .bt i{display:block;height:100%;border-radius:4px}
.sf .pc{text-align:right;font-weight:700;color:var(--tinta-2)}
.sec-det{background:#fff;border-radius:18px;padding:22px 24px;box-shadow:0 10px 30px rgba(11,20,36,.06)}
.sec-det h3{font-family:var(--font);font-size:1.35rem;line-height:1.1;margin:.3rem 0 .4rem}
.sec-det .q{font-size:.82rem;color:var(--tinta-2);margin-bottom:12px}
.sd{display:grid;grid-template-columns:118px minmax(0,1fr) 64px;gap:10px;align-items:center;margin:7px 0;font-size:.82rem}
.sd b{font-weight:700} .sd .bt{height:10px;border-radius:0 5px 5px 0} .sd em{font-style:normal;text-align:right;font-weight:700;color:var(--tinta-2)}
.sec-nota{font-size:.78rem;color:var(--suave);margin-top:1.2vh;max-width:760px}
.sec-vacio{padding:18px 6px;color:var(--tinta-2);font-size:.9rem}
@media(max-width:820px){.sec-g{grid-template-columns:minmax(0,1fr)}.sec-lista{max-height:420px}.sf{grid-template-columns:26px minmax(0,1fr) 70px 48px}.sf .nm{white-space:normal;line-height:1.2}.sec-ctl input,.sec-ctl select{min-width:0;max-width:100%;flex:1 1 100%;box-sizing:border-box}.sd{grid-template-columns:96px minmax(0,1fr) 56px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  const ancho=Math.min(150,Math.max(28,(x1-x0)*2.2)), alto=Math.min(80,Math.max(20,(y1-y0)*2.2));
  const caja={type:"Polygon",coordinates:[[[cx-ancho/2,cy-alto/2],[cx-ancho/2,cy+alto/2],[cx+ancho/2,cy+alto/2],[cx+ancho/2,cy-alto/2],[cx-ancho/2,cy-alto/2]]]};
  const pr=d3.geoMercator().fitExtent([[10,10],[590,510]],caja), pa=d3.geoPath(pr);
  s.append("g").selectAll("path").data(GEO).join("path").attr("d",pa)
   .attr("fill",g=>porNum[+g.id]===pais?col("9001"):(porNum[+g.id]&&porNum[+g.id].r===pais.r?"rgba(11,20,36,.13)":"rgba(11,20,36,.07)"));
}
const svg=d3.select("#mapa"), proj=d3.geoEqualEarth().fitExtent([[4,4],[956,466]],{type:"Sphere"}), path=d3.geoPath(proj);
fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(r=>r.json()).then(w=>{
  const geo=topojson.feature(w,w.objects.countries).features.filter(f=>f.id!=="010"); GEO=geo; if(abierto) pintaMapaPais();
  rutas=svg.append("g").selectAll("path").data(geo).join("path").attr("class","p").attr("d",path)
   .on("mousemove",(ev,f)=>tipPais(ev,porNum[+f.id])).on("mouseleave",()=>tip.style.opacity=0)
   .on("click",(ev,f)=>{const p=porNum[+f.id]; if(p) eligePais(p);});
  pintaMapa();
});
function pintaMapa(){
  if(!rutas) return;
  const xs=P.map(p=>cert(p,norma)).filter(x=>x>0).sort((a,b)=>a-b);
  const c=[...new Set([1,2,3,4,5].map(i=>xs[Math.floor(xs.length*i/6)]))];
  const rampa=d3.quantize(d3.interpolateRgb(d3.interpolateRgb("#EFEDE5",col(norma))(.18), d3.interpolateRgb(col(norma),"#0B1424")(.25)), c.length+1);
  const esc=d3.scaleThreshold().domain(c).range(rampa);
  rutas.attr("fill",f=>{const p=porNum[+f.id], v=p?cert(p,norma):0; return v?esc(v):"rgba(11,20,36,.06)";}).classed("sel",f=>porNum[+f.id]===pais);
  document.getElementById("escala").innerHTML=`<div class="bins">${rampa.map(x=>`<span style="background:${x}"></span>`).join("")}</div><div class="lbl tab">${[1,...c].map(x=>`<span>${n(x)}</span>`).join("")}</div><span>${T.certificados} · ${T.sinCertGris}</span>`;
}
function tipPais(ev,p){
  if(!p){tip.style.opacity=0; return;}
  const c=cert(p,norma), [lg,de]=lugar(p,norma), v=varp(c,prev(p,norma));
  tip.innerHTML=`<b>${nom(p)}</b><div class="r"><span>${ROT[norma]}</span><span class="tab">${n(c)}</span></div>`+(c?`<div class="r"><span>${T.lugarMundo}</span><span>${ord(lg)} ${T.de} ${de}</span></div><div class="r"><span>${T.contra2024}</span><span>${vtxt(v)}</span></div>`:"");
  tip.style.opacity=1; tip.style.left=Math.min(ev.clientX+16,innerWidth-230)+"px"; tip.style.top=(ev.clientY+16)+"px";
}

// ---------- ranking (al entrar arranca en 2024 y salta a 2025)
let anio=2025; const alt=document.getElementById("alterna");
const ponAnio=a=>{anio=a; alt.querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.a===a)); pintaRank();};
alt.querySelectorAll("button").forEach(b=>b.onclick=()=>ponAnio(+b.dataset.a));
alEntrar("e-rank",()=>{ ponAnio(2024); setTimeout(()=>ponAnio(2025),1300); });
const rank=document.getElementById("rank"), filas={};
function pintaRank(){
  document.getElementById("rkEtq").textContent=ROT[norma]+" · "+TEMA[norma]; document.getElementById("rkEtq").style.color=COLOR[norma+"_txt"]||col(norma);
  document.getElementById("rkH").textContent=T.rkH; rank.style.setProperty("--cn",col(norma)); rank.style.setProperty("--cn-txt",COLOR[norma+"_txt"]||col(norma));
  const val=p=>anio===2024?(prev(p,norma)||0):cert(p,norma);
  const orden=P.filter(p=>val(p)>0).sort((a,b)=>val(b)-val(a)), top=orden.slice(0,10);
  const v1=val(top[0]||{d:{}})||1, v2=val(top[1]||{d:{}})||v1, corta=v1>3*v2, max=corta?v2*1.25:v1;
  const yoI=orden.indexOf(pais), vis=[...top]; if(yoI>=10) vis.push(pais);
  const h=parseFloat(getComputedStyle(rank).getPropertyValue("--h"))||0;
  Object.values(filas).forEach(f=>f.style.opacity=0);
  vis.forEach((p,i)=>{
    let f=filas[p.a2];
    if(!f){ f=document.createElement("div"); f.className="rk"; f.innerHTML=`<span class="pos tab"></span><span class="nom"></span><span class="bt"><i></i><b class="q"></b></span><span class="val tab"></span>`; f.onclick=()=>eligePais(p); rank.appendChild(f); filas[p.a2]=f; f.style.transform=`translateY(${11*48}px)`; }
    const alto=f.getBoundingClientRect().height||40, y=i>=10? i*alto+alto*.4 : i*alto;
    f.style.opacity=1; f.style.transform=`translateY(${y}px)`; f.classList.toggle("yo",p===pais);
    f.querySelector(".pos").textContent=i>=10?yoI+1:i+1; f.querySelector(".nom").textContent=nom(p); f.querySelector(".val").textContent=n(val(p));
    const bi=f.querySelector("i"); f.querySelector(".bt").classList.toggle("cortada",val(p)>max); requestAnimationFrame(()=>bi.style.width=Math.min(100,val(p)/max*100)+"%");
  });
  Object.keys(filas).filter(a=>!vis.includes(porA2[a])).forEach(a=>filas[a].style.transform=`translateY(${12*44}px)`);
  const alto=(Object.values(filas)[0]||{getBoundingClientRect:()=>({height:40})}).getBoundingClientRect().height||40;
  const hTabla=vis.length*alto+(yoI>=10?alto*.4:0);
  let nota=rank.querySelector(".nota-rk"); if(!nota){ nota=document.createElement("p"); nota.className="nota-rk"; rank.appendChild(nota); }
  nota.style.top=(hTabla+6)+"px";
  nota.innerHTML = corta ? T.cortaNota.replace("{a}",nom(top[0])).replace("{x}",(Math.round(v1/v2*10)/10).toString()).replace("{b}",nom(top[1])) : "";
  rank.style.height=(hTabla+(corta?28:0))+"px";
}

// ---------- lo que se movió (cada norma con su color)
const NOTA={"27001":1,"37001":2,"28000":3};
const conVar=DATOS.normas.filter(k=>DATOS.mundo[k][2]).map(k=>({k,v:(DATOS.mundo[k][0]-DATOS.mundo[k][2])/DATOS.mundo[k][2]*100})).sort((a,b)=>b.v-a.v), vmax=conVar[0].v;
document.getElementById("mov").innerHTML=conVar.map(o=>`<div class="mv"><span class="n"><b>${base(o.k)}${NOTA[o.k]?`<sup> ${NOTA[o.k]}</sup>`:""}</b><small>${ver(o.k)} · ${TEMA[o.k]}</small></span><span class="bt"><i data-w="${o.v/vmax*100}" style="background:${col(o.k)}"></i></span><span class="val tab">+${Math.round(o.v)}%</span></div>`).join("");
document.getElementById("notas").innerHTML=T.notas.map((x,i)=>`<span><sup>${i+1}</sup> ${x}</span>`).join("");

// ---------- medidas por primera vez
document.getElementById("nuevas").innerHTML=["42001","37301"].map(k=>{
  const top=P.filter(p=>cert(p,k)>0).sort((a,b)=>cert(b,k)-cert(a,k)).slice(0,7), mx=cert(top[0],k);
  return `<div class="nv" style="--c:${col(k)}"><p class="etq">${ROT[k]} · ${TEMA[k]}</p><div class="grande tab">${n(DATOS.mundo[k][0])}</div><p>${T.nuevas[k].replace("{p}",nom(top[0])).replace("{c}",n(cert(top[0],k)))}</p>`+
   top.map((p,i)=>`<div class="mini${i===0?" top":""}"><span>${nom(p)}</span><span class="bt"><i data-w="${cert(p,k)/mx*100}"></i></span><span class="val tab">${n(cert(p,k))}</span></div>`).join("")+`</div>`; }).join("");
alEntrar("e-nuevas",crece("#nuevas i"));

// ---------- selectores de país
const opciones=sel=>P.filter(p=>Object.keys(p.d).length).sort((a,b)=>nom(a).localeCompare(nom(b),L)).map(p=>`<option value="${p.a2}"${p===sel?" selected":""}>${nom(p)}</option>`).join("");
["adivPais","formPais","tpPais"].forEach(id=>{const s=document.getElementById(id); if(!s) return; s.innerHTML=opciones(pais); s.onchange=()=>eligePais(porA2[s.value]);});

// ---------- por industria (sectores IAF). Reparto entre los certificados que DECLARAN industria:
// un certificado puede declarar varias, y en 2025 ISO no publica por país cuántos no la declaran.
let secAmb="pais", secNorma="9001", secSel=null, secFiltro="";
const secNom=c=>SEC.nombres[c][L==="es"?0:1];
const secFold=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function secDatos(k){ if(secAmb==="mundo"){ const a=SEC.mundo[k]; return a?Object.fromEntries(a.map((v,i)=>[String(i+1),v]).filter(x=>x[1])):null; } return (SEC.paises[pais.a2]||{})[k]||null; }
function secNormas(){ return DATOS.normas.filter(k=>{ const d=secDatos(k); return d&&Object.values(d).some(v=>v>0); }); }
function pintaSec(){
  const ks=secNormas(); if(!ks.includes(secNorma)) secNorma=ks.includes("9001")?"9001":(ks[0]||"9001");
  const sel=document.getElementById("secNorma");
  sel.innerHTML=ks.map(k=>`<option value="${k}"${k===secNorma?" selected":""}>${ROT[k]} · ${TEMA[k]}</option>`).join("");
  document.getElementById("secAmbPais").textContent=nom(pais);
  document.querySelectorAll("#secAmb button").forEach(b=>b.classList.toggle("on",b.dataset.a===secAmb));
  document.getElementById("secEtq").textContent=(secAmb==="mundo"?T.secMundo:nom(pais))+" · "+T.secEtq;
  const lista=document.getElementById("secLista"), det=document.getElementById("secDet"), d=secDatos(secNorma);
  if(!d){ lista.innerHTML=`<p class="sec-vacio">${T.secVacio.replace("{p}",nom(pais))}</p>`; det.innerHTML=""; document.getElementById("secNota").textContent=""; return; }
  const tot=Object.values(d).reduce((a,b)=>a+b,0), filas=Object.entries(d).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]), max=filas[0][1];
  if(!secSel||!d[secSel]) secSel=filas[0][0];
  const f=secFold(secFiltro), vis=filas.filter(([c])=>!f||secFold(secNom(c)).includes(f)||c===f);
  lista.innerHTML=vis.length?vis.map(([c,v])=>`<div class="sf${c===secSel?" on":""}" data-c="${c}" title="${secNom(c)}"><span class="cod">${c}</span><span class="nm">${secNom(c)}</span><span class="bt"><i style="width:${(v/max*100).toFixed(1)}%;background:${col(secNorma)}"></i></span><span class="pc tab">${(v/tot*100).toFixed(v/tot<.01?1:0)}%</span></div>`).join(""):`<p class="sec-vacio">${T.secNada}</p>`;
  lista.querySelectorAll(".sf").forEach(el=>el.onclick=()=>{ secSel=el.dataset.c; pintaSec(); if(plano()) document.getElementById("secDet").scrollIntoView({behavior:"smooth",block:"nearest"}); });
  // la industria elegida: qué normas se certifican más en ella
  const otras=DATOS.normas.map(k=>{ const x=secDatos(k); return [k,x?(x[secSel]||0):0]; }).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]), mx=(otras[0]||[0,1])[1];
  det.innerHTML=`<p class="etq">IAF ${secSel}</p><h3>${secNom(secSel)}</h3><p class="q">${T.secDetQ}</p>`+
    otras.map(([k,v])=>`<div class="sd"><b style="color:${COLOR[k+"_txt"]||col(k)}">${corto(k)}</b><span class="bt" style="width:${Math.max(3,v/mx*100).toFixed(1)}%;background:${col(k)}"></span><em class="tab">${n(v)}</em></div>`).join("");
  document.getElementById("secNota").textContent=secAmb==="mundo"
    ? T.secNotaMundo.replace("{x}",SEC.cobertura[secNorma]??"—").replace("{k}",ROT[secNorma])
    : T.secNotaPais;
}
document.querySelectorAll("#secAmb button").forEach(b=>b.onclick=()=>{ secAmb=b.dataset.a; secSel=null; pintaSec(); });
document.getElementById("secNorma").onchange=e=>{ secNorma=e.target.value; secSel=null; pintaSec(); };
const sb=document.getElementById("secBusca"); sb.placeholder=T.secBusca; sb.oninput=()=>{ secFiltro=sb.value.trim(); pintaSec(); };
function eligePais(p){ pais=p; ["adivPais","formPais","tpPais"].forEach(id=>{const s=document.getElementById(id); if(s) s.value=p.a2;}); pintaMapa(); pintaRank(); pintaCandado(); if(abierto){ pintaPais(); secSel=null; pintaSec(); } }

// ---------- adivina + candado
const slider=document.getElementById("slider"), guess=document.getElementById("guess");
const sv=()=>Math.round(Math.pow(10,1+slider.value/1000*(Math.log10(700000)-1)));
const red=x=>{const m=Math.pow(10,Math.max(0,Math.floor(Math.log10(x))-1)); return Math.round(x/m)*m;};
if(slider){
  slider.oninput=()=>{ guess.textContent=n(red(sv())); };
  slider.oninput();
  document.getElementById("revela").onclick=()=>{
    const g=red(sv()), r=cert(pais,"9001"), f=g>r?g/r:r/g, [lg,de]=lugar(pais,"9001");

    document.getElementById("resp").innerHTML=`<div class="real tab">${n(r)}</div><p><b>${ver}</b> ${T.lugarTxt.replace("{p}",nom(pais)).replace("{l}",ord(lg)).replace("{de}",de)}</p>`;
    cuenta(document.querySelector("#resp .real"),g,r,900);
  };
}
function pintaCandado(){

}
const env=document.getElementById("enviar");
const muestraEnviado=c=>{ const e=document.getElementById("enviado"); e.classList.add("on");
  e.innerHTML=`<b>${T.revisa}</b><p>${T.enviadoA.replace("{c}",c)}</p>`+(CFG.api?"":`<p><a href="">${T.verCorreo}</a></p>`); env.style.display="none"; };
if(env) env.onclick=async()=>{
  const inp=document.getElementById("correo"), c=inp.value.trim();
  if(!CFG.api){ muestraEnviado(c||"nombre@empresa.com"); return; }

  env.disabled=true; env.textContent=T.enviando;
  try{
    const r=await fetch(CFG.api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:c,pais:document.getElementById("formPais").value,boletin:document.getElementById("boletin").checked,idioma:L,sitio:document.getElementById("sitio").value})});
    if(!r.ok) throw new Error(String(r.status));

  }catch(_){ env.disabled=false; env.textContent=T.enviar; document.getElementById("enviado").classList.add("on"); document.getElementById("enviado").innerHTML=`<p>${T.errorEnvio}</p>`; }
};

// ---------- desbloqueado: tu país
function pintaPais(){
  setAcento("9001");
  const c=cert(pais,"9001"), [lg,de]=lugar(pais,"9001"), [lr,dr]=lugarReg(pais,"9001"), v=varp(c,prev(pais,"9001")), s=(pais.d["9001"]||[0,0])[1];
  document.getElementById("u1Etq").textContent=T.u1Etq;
  document.getElementById("u1Pais").textContent=nom(pais);
  document.getElementById("u1En").textContent=T.u1En;
  const c9=col("9001");
  const st=[[n(c),`<em style="color:${c9}">ISO 9001:2015</em> · ${TEMA["9001"]}`],
            [`<span class="${(v||0)>=0?"sube":"baja"}">${vtxt(v)}</span>`,T.u1Var],
            [`${ord(lg)}<small>${T.de} ${de}</small>`,T.lugarMundo],
            [`${ord(lr)}<small>${T.de} ${dr}</small>`,T.enReg.replace("{r}",reg(pais.r))]];
  document.getElementById("tiles").innerHTML=st.map(([a,b])=>`<div class="st"><b class="tab">${a}</b><span>${b}</span></div>`).join("");
  pintaMapaPais();
  document.getElementById("u2Etq").textContent=nom(pais);
  const ks=DATOS.normas.filter(k=>cert(pais,k)>0);
  document.getElementById("lista").innerHTML=ks.map(k=>{const c=cert(pais,k), [l,d]=lugar(pais,k), v=varp(c,prev(pais,k)), x=d>1?(1-(l-1)/(d-1))*100:100;
    return `<div class="ps"><span class="dot" style="background:${col(k)}"></span><span class="n"><b>${base(k)}</b><small>${ver(k)} · ${TEMA[k]}</small></span><span class="num tab">${n(c)}</span><span class="num tab ${v==null?"":(v>=0?"sube":"baja")}">${v==null&&NUEVAS.has(k)?T.nueva:vtxt(v)}</span><span class="tira-pos"><i data-x="${x}" style="background:${col(k)}"></i><em>${ord(l)} ${T.de} ${d}</em></span></div>`;}).join("");
  const mueve=()=>document.querySelectorAll(".tira-pos i").forEach((i,j)=>setTimeout(()=>i.style.left=i.dataset.x+"%",j*50));
  if(ya.has("e-u2")) mueve(); else alEntrar("e-u2",mueve);
  pintaRegion(); pintaCompara();
}
function pintaRegion(){
  const k=norma, top=P.filter(p=>p.r===pais.r&&cert(p,k)>0).sort((a,b)=>cert(b,k)-cert(a,k)), vis=top.slice(0,8); if(!vis.includes(pais)&&cert(pais,k)) vis.push(pais);
  const mx=cert(vis[0]||pais,k)||1, [lr,dr]=lugarReg(pais,k);
  const e=document.getElementById("regEtq"); e.textContent=ROT[k]+" · "+TEMA[k]; e.style.color=COLOR[k+"_txt"]||col(k);
  document.getElementById("regH").textContent=reg(pais.r)+(lr?` · ${ord(lr)} ${T.de} ${dr}`:"");
  document.getElementById("region").innerHTML=vis.map(p=>`<div class="mini${p===pais?" top":""}" style="--c:${col(k)};${p===pais?"color:"+(COLOR[k+"_txt"]||col(k)):""}"><span>${nom(p)}</span><span class="bt"><i style="width:${cert(p,k)/mx*100}%"></i></span><span class="val tab">${n(cert(p,k))}</span></div>`).join("");
}
function pintaCompara(){
  document.getElementById("cmpH").textContent=T.cmpH.replace("{a}",nom(pais)).replace("{b}",nom(comp));
  document.getElementById("leyenda").innerHTML=`<span><i style="background:#3a4f8a"></i>${nom(pais)}</span><span><i style="background:#9a4545"></i>${nom(comp)}</span>`;
  const ks=["9001","14001","45001","27001","22000","37001","50001","13485"];
  document.getElementById("compara").innerHTML=ks.map(k=>{const a=cert(pais,k), b=cert(comp,k), m=Math.max(a,b)||1;
    return `<div class="cmp"><b>${corto(k)}</b><div><div class="b"><span data-w="${a/m*100}" style="background:#3a4f8a"></span><em class="tab">${n(a)}</em></div><div class="b"><span data-w="${b/m*100}" style="background:#9a4545"></span><em class="tab">${n(b)}</em></div></div></div>`;}).join("");
  const crecer=()=>document.querySelectorAll(".cmp span").forEach(s=>s.style.width=s.dataset.w+"%");
  if(ya.has("e-u3")) requestAnimationFrame(crecer); else alEntrar("e-u3",crecer);
}

// ---------- cierre
document.getElementById("salv").innerHTML=T.salv.map(x=>`<li>${x}</li>`).join("");

// ---------- arranque
if(abierto){ pintaPais(); pintaSec(); }
